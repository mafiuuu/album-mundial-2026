<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Album Mundial 2026</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&display=swap');
:root {
  --verde: #1a472a; --verde2: #2d6a4f; --dorado: #f4a829; --dorado2: #ffd166;
  --rojo: #e63946; --gris: #e9ecef; --gtxt: #6c757d; --bg: #f0f2f0; --sombra: rgba(0,0,0,0.15);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Nunito', sans-serif; background: var(--bg); min-height: 100vh; color: #1a1a2e; }
header { background: linear-gradient(135deg, var(--verde), var(--verde2)); padding: 16px; text-align: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
header h1 { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; letter-spacing: 2px; color: var(--dorado); line-height: 1; }
header p { font-size: 0.75rem; color: rgba(255,255,255,0.85); margin-top: 2px; }
.stats-bar { background: white; padding: 12px 16px; display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; border-bottom: 3px solid var(--dorado); box-shadow: 0 2px 8px var(--sombra); }
.stat-item { text-align: center; }
.stat-num { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; line-height: 1; color: var(--verde); }
.stat-num.red { color: var(--rojo); }
.stat-num.gold { color: #c17f00; }
.stat-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--gtxt); font-weight: 700; }
.prog-wrap { background: var(--gris); height: 8px; border-radius: 4px; margin: 0 16px; overflow: hidden; }
.prog-fill { height: 100%; background: linear-gradient(90deg, var(--verde), var(--dorado)); border-radius: 4px; transition: width 0.5s; width: 0%; }
.prog-label { text-align: center; font-size: 0.7rem; color: var(--gtxt); padding: 4px 0 8px; font-weight: 700; }
.dinero { background: linear-gradient(135deg,#fff8e7,#fff3cc); border: 2px solid var(--dorado2); margin: 8px 16px; border-radius: 12px; padding: 10px 16px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.dinero .icon { font-size: 1.3rem; }
.dinero .txt { font-size: 0.8rem; color: #7a5c00; font-weight: 700; }
.dinero .monto { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; color: #c17f00; }
.search-wrap { padding: 10px 16px 6px; }
.search-box { width: 100%; padding: 10px 14px; border-radius: 12px; border: 2px solid var(--gris); font-family: 'Nunito', sans-serif; font-size: 0.9rem; font-weight: 700; outline: none; background: white; }
.search-box:focus { border-color: var(--verde); }
.search-results { background: white; border-radius: 12px; margin: 6px 16px 0; box-shadow: 0 4px 16px var(--sombra); overflow: hidden; display: none; }
.sr-item { padding: 10px 14px; border-bottom: 1px solid var(--gris); display: flex; align-items: center; justify-content: space-between; }
.sr-item:last-child { border-bottom: none; }
.sr-code { font-family: 'Bebas Neue', sans-serif; font-size: 1rem; color: var(--verde); letter-spacing: 1px; display: block; }
.sr-desc { font-size: 0.72rem; color: var(--gtxt); display: block; }
.sr-btns { display: flex; gap: 6px; flex-shrink: 0; }
.bxs { padding: 5px 10px; border: none; border-radius: 8px; font-family: 'Nunito', sans-serif; font-size: 0.7rem; font-weight: 800; cursor: pointer; white-space: nowrap; }
.bx-v { background: var(--verde); color: white; }
.bx-r { background: var(--dorado); color: #1a1a1a; }
.bx-q { background: var(--rojo); color: white; }
.legend { display: flex; gap: 12px; justify-content: center; padding: 8px 0 4px; font-size: 0.7rem; font-weight: 700; color: var(--gtxt); flex-wrap: wrap; }
.legend span { display: flex; align-items: center; gap: 4px; }
.ldot { width: 12px; height: 12px; border-radius: 3px; border: 2px solid; }
.ld-v { background: var(--gris); border-color: #ccc; }
.ld-t { background: #d4edda; border-color: var(--verde2); }
.ld-r { background: #fff3cd; border-color: var(--dorado); }
.filtros { display: flex; gap: 6px; padding: 6px 16px 4px; }
.fbtn { flex: 1; padding: 7px 6px; border: 2px solid var(--gris); border-radius: 10px; background: white; font-family: 'Nunito', sans-serif; font-size: 0.7rem; font-weight: 800; cursor: pointer; color: var(--gtxt); text-align: center; }
.fbtn.fa { background: var(--verde); color: white; border-color: var(--verde); }
.fbtn.ft { background: #d4edda; color: var(--verde); border-color: var(--verde2); }
.fbtn.fr { background: #fff3cd; color: #7a5c00; border-color: var(--dorado); }
.export-wrap { display: flex; gap: 6px; padding: 4px 16px 2px; }
.ebtn { flex: 1; padding: 7px 6px; border: 2px solid; border-radius: 10px; background: white; font-family: 'Nunito', sans-serif; font-size: 0.68rem; font-weight: 800; cursor: pointer; text-align: center; }
.ebtn-csv { border-color: #0077b6; color: #0077b6; }
.ebtn-txt { border-color: #495057; color: #495057; }
.tabs { display: flex; padding: 8px 16px 0; overflow-x: auto; gap: 3px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { padding: 7px 14px; border: none; background: var(--gris); font-family: 'Nunito', sans-serif; font-size: 0.75rem; font-weight: 800; cursor: pointer; border-radius: 8px 8px 0 0; white-space: nowrap; color: var(--gtxt); }
.tab.active { background: var(--verde); color: white; }
.content { padding: 0 16px 80px; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }
.sec-card { background: white; border-radius: 0 12px 12px 12px; padding: 12px; margin-bottom: 10px; box-shadow: 0 2px 8px var(--sombra); }
.sec-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 2px solid var(--gris); }
.sec-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; letter-spacing: 1px; color: var(--verde); }
.sec-prog { font-size: 0.7rem; font-weight: 800; color: var(--gtxt); background: var(--gris); padding: 3px 8px; border-radius: 20px; }
.sec-prog.done { background: #d4edda; color: #155724; }
.eq-label { font-size: 0.65rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--gtxt); margin: 8px 0 4px; }
.grid { display: grid; grid-template-columns: repeat(5,1fr); gap: 5px; }
.cell { aspect-ratio: 1; border-radius: 6px; border: 2px solid var(--gris); background: var(--gris); display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; transition: transform 0.15s; }
.cell:active { transform: scale(0.88); }
.cell-code { font-family: 'Bebas Neue', sans-serif; font-size: 0.65rem; color: #555; text-align: center; padding: 2px; word-break: break-all; line-height: 1; }
.cell.st-t { background: linear-gradient(135deg,#d4edda,#a8d5b5); border-color: var(--verde2); }
.cell.st-t .cell-code { color: var(--verde); }
.cell.st-t::after { content: '\2713'; position: absolute; bottom: 1px; right: 2px; font-size: 0.5rem; color: var(--verde); font-weight: 900; }
.cell.st-r { background: linear-gradient(135deg,#fff3cd,#ffd166); border-color: var(--dorado); }
.cell.st-r .cell-code { color: #7a5c00; }
.cell.st-r::after { content: '+'; position: absolute; bottom: 0; right: 2px; font-size: 0.7rem; color: #c17f00; font-weight: 900; }
.badge { position: absolute; top: -4px; right: -4px; background: var(--rojo); color: white; border-radius: 50%; width: 15px; height: 15px; font-size: 0.5rem; font-weight: 900; display: flex; align-items: center; justify-content: center; }

/* VISTA GLOBAL para filtros tengo/repetidas */
#vista-global { display: none; padding: 0 16px 80px; }
#vista-global.visible { display: block; }
.global-card { background: white; border-radius: 12px; padding: 12px; box-shadow: 0 2px 8px var(--sombra); }
.global-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; color: var(--verde); letter-spacing: 1px; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 2px solid var(--gris); }
.global-empty { text-align: center; color: var(--gtxt); font-size: 0.85rem; padding: 30px 0; font-weight: 700; }

.modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; align-items: flex-end; justify-content: center; }
.modal-bg.open { display: flex; }
.modal { background: white; border-radius: 20px 20px 0 0; padding: 20px; width: 100%; max-width: 480px; animation: su 0.25s ease; }
@keyframes su { from { transform: translateY(100%); } to { transform: translateY(0); } }
.m-handle { width: 40px; height: 4px; background: var(--gris); border-radius: 2px; margin: 0 auto 16px; }
.m-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; color: var(--verde); letter-spacing: 1px; text-align: center; margin-bottom: 4px; }
.m-desc { font-size: 0.8rem; color: var(--gtxt); text-align: center; margin-bottom: 16px; }
.m-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.mbtn { padding: 14px; border: none; border-radius: 12px; font-family: 'Nunito', sans-serif; font-size: 0.85rem; font-weight: 800; cursor: pointer; }
.mb-v { background: var(--verde); color: white; }
.mb-y { background: var(--dorado); color: #1a1a1a; }
.mb-g { background: var(--gris); color: #555; grid-column: span 2; }
.mb-r { background: var(--rojo); color: white; grid-column: span 2; }
</style>

</head>
<body>

<header>
  <h1>&#9917; Album Mundial 2026</h1>
  <p>Mexico &middot; Estados Unidos &middot; Canada</p>
</header>

<div class="stats-bar">
  <div class="stat-item"><div class="stat-num" id="s-tengo">0</div><div class="stat-label">Tengo</div></div>
  <div class="stat-item"><div class="stat-num red" id="s-faltan">0</div><div class="stat-label">Faltan</div></div>
  <div class="stat-item"><div class="stat-num gold" id="s-rep">0</div><div class="stat-label">Repetidas</div></div>
  <div class="stat-item"><div class="stat-num" id="s-total">0</div><div class="stat-label">Total</div></div>
</div>
<div class="prog-wrap"><div class="prog-fill" id="prog-fill"></div></div>
<div class="prog-label" id="prog-label">0% completado</div>

<div class="dinero">
  <span class="icon">&#128176;</span>
  <span class="txt">Gastaste en sobres:</span>
  <span class="monto" id="dinero">$0</span>
</div>

<div class="search-wrap">
  <input class="search-box" id="search-input" type="text" placeholder="Buscar: ARG 10, FWC 3, CC 1..." autocomplete="off">
</div>
<div class="search-results" id="search-results"></div>

<div class="legend">
  <span><div class="ldot ld-v"></div> Sin figurita</span>
  <span><div class="ldot ld-t"></div> Tengo</span>
  <span><div class="ldot ld-r"></div> Repetida</span>
</div>

<div class="filtros">
  <button class="fbtn fa" id="fb-todos" onclick="setFiltro('todos')">Todas</button>
  <button class="fbtn" id="fb-tengo" onclick="setFiltro('tengo')">Las que tengo</button>
  <button class="fbtn" id="fb-rep" onclick="setFiltro('rep')">Repetidas</button>
</div>

<div class="export-wrap">
  <button class="ebtn ebtn-csv" onclick="exportar('csv')">&#8659; Exportar CSV</button>
  <button class="ebtn ebtn-txt" onclick="exportar('txt')">&#8659; Exportar TXT</button>
</div>

<div class="tabs" id="tabs-bar"></div>
<div class="content" id="content"></div>
<div id="vista-global">
  <div class="global-card">
    <div class="global-title" id="global-title">Figuritas</div>
    <div class="grid" id="global-grid"></div>
    <div class="global-empty" id="global-empty" style="display:none">No hay figuritas en esta categoria todavia.</div>
  </div>
</div>

<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <div class="m-handle"></div>
    <div class="m-title" id="m-title"></div>
    <div class="m-desc" id="m-desc"></div>
    <div class="m-btns">
      <button class="mbtn mb-v" id="m-btn-tengo">La tengo</button>
      <button class="mbtn mb-y" id="m-btn-rep">+ Repetida</button>
      <button class="mbtn mb-r" id="m-btn-quitar" style="display:none">Quitar figurita</button>
    </div>
    <button class="mbtn mb-g" id="m-btn-cancel">Cancelar</button>
  </div>
</div>

<script>
var EQUIPOS = {
  A: ['Mexico','Sudafrica','Corea del Sur','Rep. Checa'],
  B: ['Canada','Suiza','Qatar','Bosnia y Herz.'],
  C: ['Brasil','Marruecos','Haiti','Escocia'],
  D: ['Estados Unidos','Paraguay','Australia','Turquia'],
  E: ['Alemania','Curazao','Costa de Marfil','Ecuador'],
  F: ['Paises Bajos','Japon','Suecia','Tunez'],
  G: ['Belgica','Egipto','Iran','Nueva Zelanda'],
  H: ['Espana','Uruguay','Arabia Saudita','Cabo Verde'],
  I: ['Francia','Senegal','Noruega','Iraq'],
  J: ['Argentina','Argelia','Austria','Jordania'],
  K: ['Portugal','Colombia','Uzbekistan','Congo DR'],
  L: ['Inglaterra','Croacia','Panama','Ghana']
};

var CODIGOS = {
  'Mexico':'MEX','Sudafrica':'RSA','Corea del Sur':'KOR','Rep. Checa':'CZE',
  'Canada':'CAN','Suiza':'SUI','Qatar':'QAT','Bosnia y Herz.':'BIH',
  'Brasil':'BRA','Marruecos':'MAR','Haiti':'HAI','Escocia':'SCO',
  'Estados Unidos':'USA','Paraguay':'PAR','Australia':'AUS','Turquia':'TUR',
  'Alemania':'GER','Curazao':'CUW','Costa de Marfil':'CIV','Ecuador':'ECU',
  'Paises Bajos':'NED','Japon':'JPN','Suecia':'SWE','Tunez':'TUN',
  'Belgica':'BEL','Egipto':'EGY','Iran':'IRN','Nueva Zelanda':'NZL',
  'Espana':'ESP','Uruguay':'URU','Arabia Saudita':'KSA','Cabo Verde':'CPV',
  'Francia':'FRA','Senegal':'SEN','Noruega':'NOR','Iraq':'IRQ',
  'Argentina':'ARG','Argelia':'ALG','Austria':'AUT','Jordania':'JOR',
  'Portugal':'POR','Colombia':'COL','Uzbekistan':'UZB','Congo DR':'COD',
  'Inglaterra':'ENG','Croacia':'CRO','Panama':'PAN','Ghana':'GHA'
};

function buildAlbum() {
  var secs = [];
  secs.push({id:'intro',label:'INTRO',nombre:'Introduccion',stickers:[{code:'00',desc:'Portada del album'}]});
  var fwc = [];
  for (var i=1;i<=19;i++) fwc.push({code:'FWC '+i,desc:'Copa del Mundo #'+i});
  secs.push({id:'fwc',label:'FWC',nombre:'Copa del Mundo',stickers:fwc});
  var gkeys = Object.keys(EQUIPOS);
  for (var g=0;g<gkeys.length;g++) {
    var gk = gkeys[g];
    var eqs = EQUIPOS[gk];
    var stickers = [];
    for (var e=0;e<eqs.length;e++) {
      var eq = eqs[e]; var cod = CODIGOS[eq];
      for (var n=1;n<=20;n++) stickers.push({code:cod+' '+n,desc:eq+' #'+n});
    }
    secs.push({id:'g'+gk,label:'GRP '+gk,nombre:'Grupo '+gk,stickers:stickers,equipos:eqs});
  }
  var cc = [];
  for (var j=1;j<=14;j++) cc.push({code:'CC '+j,desc:'Coleccion Copa #'+j});
  secs.push({id:'cc',label:'CC',nombre:'Coleccion Copa',stickers:cc});
  return secs;
}

var SECTIONS = buildAlbum();
var TOTAL = 0;
for (var si=0;si<SECTIONS.length;si++) TOTAL += SECTIONS[si].stickers.length;
var allStickers = [];
for (var si=0;si<SECTIONS.length;si++) for (var ki=0;ki<SECTIONS[si].stickers.length;ki++) allStickers.push(SECTIONS[si].stickers[ki]);

var state = {};
var repCounts = {};

function loadState() {
  try { var a=localStorage.getItem('a26'); if(a) state=JSON.parse(a); } catch(e){}
  try { var b=localStorage.getItem('a26r'); if(b) repCounts=JSON.parse(b); } catch(e){}
}
function saveState() {
  try { localStorage.setItem('a26',JSON.stringify(state)); localStorage.setItem('a26r',JSON.stringify(repCounts)); } catch(e){}
}

function renderTabs() {
  var bar = document.getElementById('tabs-bar');
  for (var i=0;i<SECTIONS.length;i++) {
    (function(idx){
      var btn = document.createElement('button');
      btn.className = 'tab'+(idx===0?' active':'');
      btn.textContent = SECTIONS[idx].label;
      btn.onclick = function() {
        var tabs = document.querySelectorAll('.tab');
        var panels = document.querySelectorAll('.tab-panel');
        for (var t=0;t<tabs.length;t++) tabs[t].classList.toggle('active',t===idx);
        for (var p=0;p<panels.length;p++) panels[p].classList.toggle('active',p===idx);
      };
      bar.appendChild(btn);
    })(i);
  }
}

function renderContent() {
  var content = document.getElementById('content');
  for (var i=0;i<SECTIONS.length;i++) {
    var sec = SECTIONS[i];
    var panel = document.createElement('div');
    panel.className = 'tab-panel'+(i===0?' active':'');
    var card = document.createElement('div');
    card.className = 'sec-card';
    var tc=0;
    for (var x=0;x<sec.stickers.length;x++) if(state[sec.stickers[x].code]) tc++;
    var head = document.createElement('div');
    head.className = 'sec-head';
    head.innerHTML = '<div class="sec-title">'+sec.nombre+'</div><div class="sec-prog'+(tc===sec.stickers.length?' done':'')+'" id="sp-'+i+'">'+tc+'/'+sec.stickers.length+'</div>';
    card.appendChild(head);
    if (sec.equipos) {
      for (var e=0;e<sec.equipos.length;e++) {
        var eq=sec.equipos[e]; var cod=CODIGOS[eq];
        var lbl=document.createElement('div'); lbl.className='eq-label'; lbl.textContent=eq;
        card.appendChild(lbl);
        var eqS=[];
        for (var x=0;x<sec.stickers.length;x++) if(sec.stickers[x].code.indexOf(cod+' ')===0) eqS.push(sec.stickers[x]);
        card.appendChild(buildGrid(eqS));
      }
    } else {
      card.appendChild(buildGrid(sec.stickers));
    }
    panel.appendChild(card);
    content.appendChild(panel);
  }
}

function buildGrid(stickers) {
  var grid = document.createElement('div');
  grid.className = 'grid';
  for (var i=0;i<stickers.length;i++) {
    (function(s){
      var cell = document.createElement('div');
      cell.className = 'cell';
      cell.setAttribute('data-code',s.code);
      var ce = document.createElement('div'); ce.className='cell-code'; ce.textContent=s.code;
      cell.appendChild(ce);
      applyCell(cell);
      cell.onclick = function(){ openModal(s.code,s.desc); };
      grid.appendChild(cell);
    })(stickers[i]);
  }
  return grid;
}

function applyCell(cell) {
  var code = cell.getAttribute('data-code');
  var st = state[code];
  cell.className = 'cell'+(st==='tengo'?' st-t':st==='rep'?' st-r':'');
  var b = cell.querySelector('.badge');
  if(b) b.parentNode.removeChild(b);
  if(st==='rep' && repCounts[code]>1) {
    var badge=document.createElement('div'); badge.className='badge'; badge.textContent=repCounts[code]; cell.appendChild(badge);
  }
  var ce=cell.querySelector('.cell-code');
  if(!ce){ce=document.createElement('div');ce.className='cell-code';cell.appendChild(ce);}
  ce.textContent=code;
}

var filtroActivo = 'todos';
var modalCode = null;

function setFiltro(f) {
  filtroActivo = f;
  document.getElementById('fb-todos').className='fbtn'+(f==='todos'?' fa':'');
  document.getElementById('fb-tengo').className='fbtn'+(f==='tengo'?' ft':'');
  document.getElementById('fb-rep').className='fbtn'+(f==='rep'?' fr':'');

  var tabsEl = document.getElementById('tabs-bar');
  var contentEl = document.getElementById('content');
  var globalEl = document.getElementById('vista-global');

  if (f==='todos') {
    tabsEl.style.display='';
    contentEl.style.display='';
    globalEl.classList.remove('visible');
  } else {
    tabsEl.style.display='none';
    contentEl.style.display='none';
    globalEl.classList.add('visible');

    var titulo = f==='tengo' ? 'Figuritas que tengo' : 'Figuritas repetidas';
    document.getElementById('global-title').textContent = titulo;

    var gg = document.getElementById('global-grid');
    gg.innerHTML='';

    var matching = [];
    for (var i=0;i<allStickers.length;i++) {
      var st = state[allStickers[i].code];
      if (f==='tengo' && st==='tengo') matching.push(allStickers[i]);
      if (f==='rep' && st==='rep') matching.push(allStickers[i]);
    }

    var emptyEl = document.getElementById('global-empty');
    if (matching.length===0) {
      emptyEl.style.display='block';
    } else {
      emptyEl.style.display='none';
      for (var m=0;m<matching.length;m++) {
        (function(s){
          var cell=document.createElement('div');
          cell.className='cell';
          cell.setAttribute('data-code',s.code);
          var ce=document.createElement('div');ce.className='cell-code';ce.textContent=s.code;
          cell.appendChild(ce);
          applyCell(cell);
          cell.onclick=function(){openModal(s.code,s.desc);};
          gg.appendChild(cell);
        })(matching[m]);
      }
    }
  }
}

function openModal(code, desc) {
  modalCode=code;
  document.getElementById('m-title').textContent=code;
  document.getElementById('m-desc').textContent=desc;
  document.getElementById('m-btn-quitar').style.display=state[code]?'block':'none';
  document.getElementById('modal-bg').classList.add('open');
}
function closeModal() { document.getElementById('modal-bg').classList.remove('open'); modalCode=null; }
document.getElementById('modal-bg').onclick=function(e){if(e.target===this)closeModal();};
document.getElementById('m-btn-cancel').onclick=closeModal;

function doSet(val) {
  if(!modalCode) return;
  if(val==='rep'){repCounts[modalCode]=(repCounts[modalCode]||1)+1;state[modalCode]='rep';}
  else if(val==='tengo'){state[modalCode]='tengo';repCounts[modalCode]=1;}
  else{delete state[modalCode];delete repCounts[modalCode];}
  saveState();
  var cells=document.querySelectorAll('.cell');
  for(var i=0;i<cells.length;i++) if(cells[i].getAttribute('data-code')===modalCode) applyCell(cells[i]);
  updateStats();
  if(filtroActivo!=='todos') setFiltro(filtroActivo);
  closeModal();
}

document.getElementById('m-btn-tengo').onclick=function(){doSet('tengo');};
document.getElementById('m-btn-rep').onclick=function(){doSet('rep');};
document.getElementById('m-btn-quitar').onclick=function(){doSet('none');};

function updateStats() {
  var tengo=0,repExtra=0;
  var codes=Object.keys(state);
  for(var i=0;i<codes.length;i++){
    var st=state[codes[i]];
    if(st==='tengo') tengo++;
    else if(st==='rep'){tengo++;repExtra+=(repCounts[codes[i]]||1)-1;}
  }
  var faltan=TOTAL-tengo;
  var pct=TOTAL>0?Math.round(tengo/TOTAL*100):0;
  document.getElementById('s-tengo').textContent=tengo;
  document.getElementById('s-faltan').textContent=faltan;
  document.getElementById('s-rep').textContent=repExtra;
  document.getElementById('s-total').textContent=TOTAL;
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('prog-label').textContent=pct+'% completado - '+tengo+' de '+TOTAL+' figuritas';
  var totalFigs=tengo+repExtra;
  var paquetes=Math.ceil(totalFigs/7);
  document.getElementById('dinero').textContent='$'+(paquetes*2000).toLocaleString('es-AR');
  for(var s=0;s<SECTIONS.length;s++){
    var sec=SECTIONS[s]; var tc=0;
    for(var x=0;x<sec.stickers.length;x++) if(state[sec.stickers[x].code]) tc++;
    var el=document.getElementById('sp-'+s);
    if(el){el.textContent=tc+'/'+sec.stickers.length;el.className='sec-prog'+(tc===sec.stickers.length?' done':'');}
  }
}

function exportar(formato) {
  var lineas = [];
  if (formato==='csv') {
    lineas.push('Codigo,Estado,Cantidad');
    for(var i=0;i<allStickers.length;i++){
      var s=allStickers[i]; var st=state[s.code];
      if(st) lineas.push(s.code+','+(st==='tengo'?'Tengo':'Repetida')+','+(repCounts[s.code]||1));
    }
  } else {
    lineas.push('=== ALBUM MUNDIAL 2026 ===');
    lineas.push('');
    lineas.push('--- LAS QUE TENGO ---');
    for(var i=0;i<allStickers.length;i++){
      var s=allStickers[i];
      if(state[s.code]==='tengo') lineas.push('  '+s.code);
    }
    lineas.push('');
    lineas.push('--- REPETIDAS ---');
    for(var i=0;i<allStickers.length;i++){
      var s=allStickers[i];
      if(state[s.code]==='rep') lineas.push('  '+s.code+' (x'+(repCounts[s.code]||1)+')');
    }
  }
  var contenido = lineas.join('\n');
  var blob = new Blob([contenido], {type: formato==='csv'?'text/csv':'text/plain'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href=url; a.download='album-mundial-2026.'+formato; a.click();
  URL.revokeObjectURL(url);
}

document.getElementById('search-input').addEventListener('input',function(){
  var q=this.value.trim().toUpperCase();
  var res=document.getElementById('search-results');
  if(!q){res.style.display='none';return;}
  var matches=[];
  for(var i=0;i<allStickers.length;i++){
    if(allStickers[i].code.toUpperCase().indexOf(q)>=0||allStickers[i].desc.toUpperCase().indexOf(q)>=0){
      matches.push(allStickers[i]); if(matches.length>=8) break;
    }
  }
  if(!matches.length){res.style.display='none';return;}
  res.style.display='block'; res.innerHTML='';
  for(var m=0;m<matches.length;m++){
    (function(s){
      var st=state[s.code];
      var item=document.createElement('div'); item.className='sr-item';
      var left=document.createElement('div');
      left.innerHTML='<span class="sr-code">'+s.code+(st==='tengo'?' ✓':st==='rep'?' +':'')+'</span><span class="sr-desc">'+s.desc+'</span>';
      var btns=document.createElement('div'); btns.className='sr-btns';
      var bv=document.createElement('button');bv.className='bxs bx-v';bv.textContent='Tengo';
      bv.onclick=function(e){e.stopPropagation();srSet(s.code,'tengo');};
      var br=document.createElement('button');br.className='bxs bx-r';br.textContent='Rep.';
      br.onclick=function(e){e.stopPropagation();srSet(s.code,'rep');};
      btns.appendChild(bv);btns.appendChild(br);
      if(st){var bq=document.createElement('button');bq.className='bxs bx-q';bq.textContent='X';bq.onclick=function(e){e.stopPropagation();srSet(s.code,'none');};btns.appendChild(bq);}
      item.appendChild(left);item.appendChild(btns);res.appendChild(item);
    })(matches[m]);
  }
});

function srSet(code,val){
  if(val==='rep'){repCounts[code]=(repCounts[code]||1)+1;state[code]='rep';}
  else if(val==='tengo'){state[code]='tengo';repCounts[code]=1;}
  else{delete state[code];delete repCounts[code];}
  saveState();
  var cells=document.querySelectorAll('.cell');
  for(var i=0;i<cells.length;i++) if(cells[i].getAttribute('data-code')===code) applyCell(cells[i]);
  updateStats();
  if(filtroActivo!=='todos') setFiltro(filtroActivo);
  document.getElementById('search-input').dispatchEvent(new Event('input'));
}

document.addEventListener('click',function(e){
  if(!e.target.closest('.search-wrap')&&!e.target.closest('#search-results')) document.getElementById('search-results').style.display='none';
});

loadState();
renderTabs();
renderContent();
updateStats();
</script>
